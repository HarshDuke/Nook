    <section class="intro wrap" id="approach"><p class="eyebrow">The opportunity</p><div><h2>The next wave of compute<br />starts in unexpected places.</h2><p>Power is one of the biggest constraints on new data centers. Meanwhile, existing industrial and commercial sites can have electrical capacity that goes underused.</p><p>Nook is developing modular data centers that put this capacity to work. We start with the site, evaluate the power, and design the infrastructure around what is possible.</p></div></section>
    <section class="approach wrap"><div class="section-top"><p class="eyebrow">The Nook approach</p><h2>Find the power.<br />Build around it.</h2></div><div class="approach-grid">
      <article><div class="icon"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M23 4 10 23h10l-3 13 14-20H20l3-12Z" /></svg></div><h3>Start with existing capacity</h3><p>Look for usable power at industrial facilities, commercial properties, and campuses with room to grow.</p></article>
      <article><div class="icon"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M5 13 20 5l15 8v16l-15 7-15-7V13ZM5 13l15 8 15-8M20 21v15M13 9l15 8v15" /></svg></div><h3>Think modular</h3><p>Develop right-sized facilities using proven prefabricated systems, with cooling and connectivity designed for the site.</p></article>
      <article><div class="icon"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><rect x="5" y="7" width="30" height="11" rx="2"/><rect x="5" y="23" width="30" height="11" rx="2"/><path d="M11 12h1m5 0h11M11 28h1m5 0h11" /></svg></div><h3>Make room for compute</h3><p>Create powered data-center capacity for cloud and compute operators, with less dependence on a single mega-project.</p></article>
    </div></section>
<section class="site-paths wrap"><h2>Where Nook can build</h2><dl>
<div><dt>Existing service</dt><dd>Industrial sites with spare capacity on an active utility connection.</dd></div>
<div><dt>Power generation</dt><dd>Generators that periodically have to curtail their output.</dd></div>
<div><dt>Distributed energy</dt><dd>Smaller installations paired with local energy resources.</dd></div>
<div><dt>Expanded service</dt><dd>Sites where a utility upgrade or new substation connection can support more load.</dd></div>
</dl></section>

<template id="owner-guide">
<section class="host-hero"><div><p class="eyebrow light">For site owners</p><h1>Your power connection could earn its keep.</h1><p>A warehouse can be full and still have spare electrical capacity. Nook works with owners to see whether a small data center can fit beside the business they already run.</p><button data-assess>Assess your site ↗</button></div><img alt="Illustrative compact Nook module and battery beside an existing access lane" src="/nook-studies/orchard/orchard.jpg"></section>
<div class="host-body">
<section><h2>What you bring. What Nook builds.</h2><div class="host-pair"><article><h3>You host the site</h3><p>A portion of the property, access to power, and a clear picture of what your operation needs. A cold store with seasonal peaks, a factory that added a second service, or a campus with room at its substation could all be worth a look.</p></article><article><h3>Nook develops the data center</h3><p>We assess the connection, lay out the modules, cooling and fiber, and seek a compute customer. That customer supplies the servers. If the site works, we negotiate what you earn for hosting it and who pays for electricity, equipment and upgrades.</p></article></div></section>
<section class="host-example"><h2>Your busiest day matters more than your average bill.</h2><p>Take a facility with a confirmed 10 MW service and a 6 MW peak. That leaves 4 MW at its busiest moment. Holding back 5% of that margin and allowing 1.25 MW of facility power for each MW of computing equipment gives <strong>3.04 MW of IT capacity</strong> in this example.</p><p>A short spike may be something a battery can cover. A long afternoon at peak may exhaust it. We replay the meter readings in order, including the time needed to recharge, and reserve capacity for the loads you plan to add.</p></section>
<section><h2>What we check with you</h2><dl class="host-list"><div><dt>Operations and growth</dt><dd>Which equipment must always have power? What happens during a defrost cycle, a shift change or a heat wave? A new production line or tenant changes the capacity available.</dd></div><div><dt>Power costs and site income</dt><dd>We compare the extra energy and monthly peak-demand charges with the proposed lease economics. We agree on metering, cost allocation and any operating limits before moving forward.</dd></div><div><dt>Fit on the ground</dt><dd>We look for a practical route from the service entrance to the module, fiber availability, maintenance access and enough separation for cooling noise. We review utility, landlord and permitting requirements with you.</dd></div></dl></section>
<section><h2>Start with what you have.</h2><p>Send the address, site type, utility and a recent bill. If the first look is promising, we’ll ask for a year of hourly or 15-minute meter readings, the service agreement or electrical one-line diagram, 12 months of bills and your expansion plans. Your facilities team or utility may already have the interval export.</p><p>You’ll receive a comparison of usable compute capacity with and without storage, the assumptions behind it, and the questions to resolve before discussing a lease.</p><button data-assess>Assess your site ↗</button></section></div>
</template>
<template id="compute-guide">
  <section class="host-hero compute-hero">
    <div><p class="eyebrow light">For compute operators</p>
      <h1>Bring your racks. Start with power.</h1>
      <p>Nook develops modular data centers beside facilities with power already on site. If you have hardware to deploy, we can evaluate a first block of capacity around your racks, your workload and your target date.</p>
      <a class="button lime" href="#capacity-brief">Plan a deployment ↓</a>
    </div>
    <figure><img src="/nook-studies/woodlands/last-light.jpg" alt="A compact data center tucked into woodland at dusk"><figcaption>Concept rendering</figcaption></figure>
  </section>
  <div class="host-body">
    <section><h2>A shorter path to first power</h2><p>A new grid connection can put an entire deployment on the same clock. We start with an existing connection, check the host’s busiest hours and identify the first block of IT power the site could support. You can evaluate that block while we establish what a later phase would require.</p></section>
    <section><h2>What to verify before placing hardware</h2>
      <dl class="host-list">
        <div><dt>Delivery date</dt><dd>Review which milestones are complete and which still control the date, from utility approval and fiber delivery to equipment installation and commissioning.</dd></div>
        <div><dt>Power through a peak or outage</dt><dd>Compare continuous IT capacity with capacity that depends on storage or a flexible workload. We review host peaks, battery runtime and recharge, and the backup plan for a grid outage separately.</dd></div>
        <div><dt>Hardware and people on site</dt><dd>Agree on who can enter the module, how technicians reach your racks and who responds after hours. Review fire protection, emergency shutdown and battery placement against the proposed layout.</dd></div>
        <div><dt>Cooling and connectivity</dt><dd>Match rack density and cooling to your hardware. Check carrier routes, latency to your other infrastructure and whether a second fiber path shares the same point of failure.</dd></div>
        <div><dt>Cost per usable kW</dt><dd>Compare the capacity charge, electricity, peak-demand charges and network costs at your expected utilization. Price any backup or expansion you need as part of the same comparison.</dd></div>
      </dl>
    </section>
    <section id="capacity-brief" tabindex="-1"><h2>Plan your first deployment</h2><p>Send your Nook contact your target region, first-phase IT megawatts, rack count and kW per rack, cooling requirements, and earliest useful delivery date. Tell us how long the workload can tolerate an interruption and where the network needs to connect.</p><p>With that brief, we can screen sites and discuss usable capacity, the steps to energization and the open questions for your engineering team.</p></section>
  </div>
