name: Deploy Nook homepage
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nook-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - name: Publish to Cloudflare
        run: npx --yes wrangler@4.168.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check the published homepage
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl -fsSL --max-time 15 "https://nookinfra.com/?release=$GITHUB_SHA" -o "$RUNNER_TEMP/nook-home" &&
              grep -Fqf <(grep -m1 '<main' src/landing.html) "$RUNNER_TEMP/nook-home"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
